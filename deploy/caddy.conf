# Caddy site on the OVH web VPS (Strasbourg): deploy/vps.sh copies it to
# /etc/caddy/sites/collabria.caddy. Serves the Astro build (dist/) as static files, with
# /about and /about/ both answering like Vercel did; the CMS login (/api/auth*) goes to the
# shared decap-oauth service (~/projects/architecture/web-vps/decap-oauth, port 8401).
# The apex redirects to www, which Decap CMS uses as base_url.
www.collabriainc.com {
	encode zstd gzip
	header Strict-Transport-Security "max-age=63072000"

	handle /api/auth* {
		reverse_proxy 127.0.0.1:8401
	}

	handle {
		root * /srv/sites/collabria/current
		@hashed path /_astro/*
		header @hashed Cache-Control "public, max-age=31536000, immutable"
		@other not path /_astro/*
		header @other Cache-Control "public, max-age=0, must-revalidate"
		try_files {path} {path}/index.html
		file_server
	}
}

collabriainc.com {
	redir https://www.collabriainc.com{uri} 308
}
